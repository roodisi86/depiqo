      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  can_answer: {type: boolean}
                  latest:
                    oneOf:
                      - $ref: '#/components/schemas/Appropriateness'
                      - type: 'null'
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        text: {type: string}
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              value: {type: string}
                              label: {type: string}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}
    post:
      tags: [Invest]
      operationId: answerAppropriateness
      summary: Submit answers; the result says whether an extra confirmation is required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties: {type: string}
      responses:
        "201":
          description: Result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appropriateness'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}

  /invest/appropriateness/confirm:
