openapi: 3.1.0
info:
  title: Depiqo tenant app API
  version: 0.6.1
  summary: JSON API for the Depiqo app for tenants (Depiqo Wallet and Depiqo Invest).
  description: |
    Tenants only. Business users and Depiqo staff use the web app and are refused here (403).

    Conventions:
    - Bearer tokens only (`Authorization: Bearer <access_token>`). Cookies are never read. A mutating request
      that carries the web session cookie `dpq_session` but no bearer token is refused with `cookie_auth_not_allowed`.
    - Every error has the shape `{"error": {"code", "message", "fields", "detail?"}}`. `code` is stable; `message`
      follows `Accept-Language` (nl, fr, en; default nl, else the user's stored language). In fr and en the specific
      Dutch text, when it says more, is in `detail`.
    - Labels in responses are Dutch and always sit next to a stable key (`status` + `status_label`, `key`, `kind`...).
    - Money is `{"cents": integer, "currency": "EUR"}`. Dates are `YYYY-MM-DD`, timestamps ISO 8601 with offset.
    - Lists that can grow use `limit` (1 to 100, default 20) and an opaque `cursor`; the response has `next_cursor`. A cursor that was not issued by the server gets 400 invalid_cursor.
    - `Idempotency-Key` (8 to 100 characters) is honoured on every mutating money endpoint and required where noted.
      The first successful response is stored for 24 hours and returned again (header `Idempotent-Replayed: true`).
      For multipart uploads the form fields and the SHA-256 of each file count, not the raw body.
    - `X-App-Platform` and `X-App-Version` may be sent on every request; an app below the minimum gets 426.
servers:
  - url: http://localhost:5000/api/v1
    description: Development
  - url: https://app.getdepiqo.com/api/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Config
  - name: Auth
  - name: Invites
  - name: Me
  - name: Notifications
  - name: Deposits
  - name: Invest
  - name: Support

paths:
  /config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Public app configuration
      security: []
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Config'}

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: Same rate limits as the web login (5 failures per email or 30 per IP in 15 minutes). With 2FA on, returns an mfa_token instead of tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                device: {$ref: '#/components/schemas/DeviceInput'}
      responses:
        "200":
          description: Tokens, or a second step is needed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/MfaChallenge'
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "426": {$ref: '#/components/responses/UpgradeRequired'}
        "429": {$ref: '#/components/responses/TooManyRequests'}

  /auth/mfa:
    post:
      tags: [Auth]
      operationId: loginSecondStep
      summary: Second step with a TOTP code or a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: {type: string}
                code: {type: string, description: "Six digits from the authenticator app, or a recovery code"}
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      second_factor: {type: string, enum: [totp, recovery]}
                      recovery_codes_left: {type: integer}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "429": {$ref: '#/components/responses/TooManyRequests'}

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair (rotation)
      description: A refresh token works once. Presenting a used one revokes the whole device session (refresh_token_reused). Send one refresh at a time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "426": {$ref: '#/components/responses/UpgradeRequired'}

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End this device session
      responses:
        "204": {description: Logged out}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}

  /auth/devices:
    get:
      tags: [Auth]
      operationId: listDevices
      summary: Active device sessions (also shown on the web page Beveiliging)
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Device'}}
        "401": {$ref: '#/components/responses/Unauthorized'}

  /auth/devices/{device_id}:
    delete:
      tags: [Auth]
      operationId: revokeDevice
      summary: Sign a device out
      parameters:
        - name: device_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "204": {description: Revoked}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}

  /invites/{token}:
    get:
      tags: [Invites]
      operationId: getInvite
      summary: Anti-phishing check of an invitation
      description: Shows landlord, address, amount and reference so the tenant can compare them with the lease before going on.
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invite'}
        "410": {$ref: '#/components/responses/Gone'}

  /invites/{token}/accept:
    post:
      tags: [Invites]
      operationId: acceptInvite
      summary: Accept an invitation
      description: |
        New account: send password, confirm_details=true and device; returns tokens (201).
        Existing tenant account: send the bearer token of that account and confirm_details=true (200).
        Existing account that is not a tenant yet: 409 use_web with the web link in fields.url.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_details]
              properties:
                confirm_details: {type: boolean, const: true}
                password: {type: string, minLength: 12}
                device: {$ref: '#/components/schemas/DeviceInput'}
      responses:
        "200":
          description: Linked to the existing account
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit_pid: {type: string}
                  status: {type: string}
        "201":
          description: Account created and logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      deposit_pid: {type: string}
                      status: {type: string}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409": {$ref: '#/components/responses/Conflict'}
        "410": {$ref: '#/components/responses/Gone'}
        "422": {$ref: '#/components/responses/ValidationFailed'}

  /devices/push-token:
    post:
      tags: [Notifications]
      operationId: registerPushToken
      summary: Register the Expo push token of this device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: {type: string, pattern: '^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_\-]{10,200}\]$'}
                platform: {type: string, enum: [ios, android]}
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  active: {type: boolean}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The tenant's own account
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Change name, language or notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 120}
                language: {type: string, enum: [nl, fr, en]}
                notification_preferences: {$ref: '#/components/schemas/NotificationPreferences'}
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "422": {$ref: '#/components/responses/ValidationFailed'}

  /me/export:
    post:
      tags: [Me]
      operationId: exportMyData
      summary: Download all own data as one JSON file
      responses:
        "200":
          description: JSON file (Content-Disposition attachment)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataExport'}
        "401": {$ref: '#/components/responses/Unauthorized'}

  /me/delete-request:
    get:
      tags: [Me]
      operationId: previewDeletion
      summary: What deleting the account means, and whether it is possible now
      responses:
        "200":
          description: Explanation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionInfo'}
        "401": {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Me]
      operationId: deleteAccount
      summary: Delete (anonymise) the account
      description: Refused (409 deletion_blocked) while a deposit is open or the investment account has money or running orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: {type: string}
                confirm: {type: boolean, const: true}
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: {type: boolean}
                  deleted_now: {type: array, items: {type: string}}
                  kept_by_law: {type: array, items: {type: string}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "429": {$ref: '#/components/responses/TooManyRequests'}

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Notifications, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        "200":
          description: A page of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
                      unread_count: {type: integer}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}

  /notifications/{notification_id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: The notification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}

  /activity:
    get:
      tags: [Me]
      operationId: listActivity
      summary: Combined history of deposit events and invest transactions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          description: A page of activity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/ActivityItem'}}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}

  /support:
    get:
      tags: [Support]
      operationId: listSupportTickets
      summary: Own support questions with their status
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          description: A page of tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/SupportTicket'}}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Support]
      operationId: createSupportTicket
      summary: Ask Depiqo support a question
      description: At most 3 questions per 10 minutes and 10 per day. Never shown to the landlord.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category: {type: string, enum: [deposit, invest, account, app, other]}
                subject: {type: string, maxLength: 120}
                message: {type: string, minLength: 10, maxLength: 4000}
                deposit_pid: {type: string}
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupportTicket'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "429": {$ref: '#/components/responses/TooManyRequests'}

  /deposits:
    get:
      tags: [Deposits]
      operationId: listDeposits
      summary: The tenant's deposits
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          description: A page of deposits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/DepositSummary'}}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}

  /deposits/{pid}:
    get:
      tags: [Deposits]
      operationId: getDeposit
      summary: One deposit with amounts, progress, location, deadline, next action, payment details and recent events
      parameters:
        - $ref: '#/components/parameters/Pid'
      responses:
        "200":
          description: The deposit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepositDetail'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}

  /deposits/{pid}/events:
    get:
      tags: [Deposits]
      operationId: listDepositEvents
      summary: Tenant-visible events of a deposit
      parameters:
        - $ref: '#/components/parameters/Pid'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/DepositEvent'}}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}

  /deposits/{pid}/identity:
    post:
      tags: [Deposits]
      operationId: verifyIdentity
      summary: Identity check for a Depiqo deposit account (sandbox KYC)
      parameters:
        - $ref: '#/components/parameters/Pid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, birth_date]
              properties:
                full_name: {type: string}
                birth_date: {type: string, format: date}
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: {type: string, enum: [account_open, opening, bank_unavailable, failed]}
                  message: {type: string}
                  deposit: {$ref: '#/components/schemas/DepositDetail'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}

  /deposits/{pid}/documents:
    get:
      tags: [Deposits]
      operationId: listDocuments
      summary: Documents of a deposit
      parameters:
        - $ref: '#/components/parameters/Pid'
      responses:
        "200":
          description: Documents and upload rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Document'}}
                  upload_kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [photo, inspection, other]}
                        label: {type: string}
                  upload_allowed: {type: boolean}
                  max_bytes: {type: integer}
                  accepted_types: {type: array, items: {type: string}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Deposits]
      operationId: uploadDocument
      summary: Add a document (PDF, JPEG or PNG, max 10 MB; a camera photo is a JPEG)
      parameters:
        - $ref: '#/components/parameters/Pid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: {type: string, enum: [photo, inspection, other]}
                file: {type: string, format: binary}
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/TooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/ValidationFailed'}

  /deposits/{pid}/documents/{doc_id}:
    get:
      tags: [Deposits]
      operationId: downloadDocument
      summary: Download a document (streamed, with the bearer token)
      parameters:
        - $ref: '#/components/parameters/Pid'
        - name: doc_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: The file
          content:
            application/pdf: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}

  /deposits/{pid}/settlement:
    get:
      tags: [Deposits]
      operationId: getSettlement
      summary: The final settlement (null until the landlord proposes one)
      parameters:
        - $ref: '#/components/parameters/Pid'
      responses:
        "200":
          description: Settlement
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement:
                    oneOf:
                      - $ref: '#/components/schemas/Settlement'
                      - type: 'null'
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}

  /deposits/{pid}/settlement/agree:
    post:
      tags: [Deposits]
      operationId: agreeSettlement
      summary: Agree with the proposed settlement
      parameters:
        - $ref: '#/components/parameters/Pid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean, const: true}
      responses:
        "200": {$ref: '#/components/responses/SettlementResult'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}

  /deposits/{pid}/settlement/dispute:
    post:
      tags: [Deposits]
      operationId: disputeSettlement
      summary: Dispute the proposed settlement (reason of at least 10 characters)
      parameters:
        - $ref: '#/components/parameters/Pid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 2000}
      responses:
        "200": {$ref: '#/components/responses/SettlementResult'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}

  /deposits/{pid}/release-form:
    get:
      tags: [Deposits]
      operationId: downloadReleaseForm
      summary: Release form (PDF) for a deposit held elsewhere, after agreement
      parameters:
        - $ref: '#/components/parameters/Pid'
      responses:
        "200":
          description: PDF
          content:
            application/pdf: {schema: {type: string, format: binary}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}

  /deposits/{pid}/payout-choice:
    get:
      tags: [Deposits]
      operationId: getPayoutChoice
      summary: Doorbeleggen options (where the tenant's share goes)
      parameters:
        - $ref: '#/components/parameters/Pid'
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayoutChoice'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}
    post:
      tags: [Deposits]
      operationId: choosePayoutToInvest
      summary: Choose the investment account for the tenant's share (until the payout starts)
      parameters:
        - $ref: '#/components/parameters/Pid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean, const: true}
      responses:
        "200":
          description: Choice stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayoutChoice'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}
    delete:
      tags: [Deposits]
      operationId: cancelPayoutToInvest
      summary: Back to the own account (until the payout starts)
      parameters:
        - $ref: '#/components/parameters/Pid'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Choice cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayoutChoice'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}

  /invest:
    get:
      tags: [Invest]
      operationId: getInvestOverview
      summary: Invest overview or onboarding state
      description: 404 invest_not_offered when the landlord does not offer Invest and there is no account; 503 partner_unavailable without a partner.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvestOverview'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}

  /invest/portfolios:
    get:
      tags: [Invest]
      operationId: listPortfolios
      summary: Model portfolios with costs in euro and scenarios for an amount
      parameters:
        - name: amount_cents
          in: query
          schema: {type: integer, minimum: 2500, maximum: 10000000, default: 100000}
      responses:
        "200":
          description: Portfolios
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount: {$ref: '#/components/schemas/Money'}
                  fee_rate_bps: {type: integer}
                  current: {type: [string, 'null']}
                  risk_text: {type: string}
                  advice_note: {type: string}
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Portfolio'
                        - type: object
                          properties:
                            costs: {$ref: '#/components/schemas/Costs'}
                            scenarios: {$ref: '#/components/schemas/Scenarios'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}

  /invest/appropriateness:
