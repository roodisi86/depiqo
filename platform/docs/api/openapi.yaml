            application/json:
              schema: {$ref: '#/components/schemas/Terms'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}
    post:
      tags: [Invest]
      operationId: acceptInvestTerms
      summary: Accept both terms (versions must match the current ones)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_version, depiqo_version, accept_partner, accept_depiqo]
              properties:
                partner_version: {type: string}
                depiqo_version: {type: string}
                accept_partner: {type: boolean, const: true}
                accept_depiqo: {type: boolean, const: true}
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
