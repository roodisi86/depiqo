        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "422": {$ref: '#/components/responses/ValidationFailed'}
        "503": {$ref: '#/components/responses/PartnerUnavailable'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token (15 minutes), stored hashed on the server.

  parameters:
    Pid:
      name: pid
      in: path
      required: true
      description: Public id of the deposit. Another tenant's pid answers 404.
      schema: {type: string}
    InviteToken:
      name: token
      in: path
      required: true
      description: The token from the invitation link /t/<token>
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page
      schema: {type: string}
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: {type: string, example: 'fr-BE,fr;q=0.9'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, pattern: '^[A-Za-z0-9_\-:.]{8,100}$'}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_\-:.]{8,100}$'}

  responses:
    BadRequest:
      description: 'Bad request: invalid_json, invalid_cursor, invalid_limit, idempotency_key_required, invalid_idempotency_key'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 'Not logged in: token_missing, token_invalid, token_expired (refresh), device_revoked, refresh_token_reused, invalid_credentials, invalid_code, mfa_token_invalid'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 'Not for this user: staff_not_allowed, not_a_tenant, cookie_auth_not_allowed, invite_for_other_account'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 'not_found (also for another tenant''s data), invest_not_offered, quote_not_found, not_available'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: 'The rules do not allow this now: invest_rejected, account_not_active, account_exists, terms_outdated, terms_not_accepted, quote_used, quote_expired, settlement_not_open, payout_choice_closed, identity_not_possible, deposit_closed, deletion_blocked, login_required, use_web, invite_not_accepted, idempotency_in_progress, invest_not_offered, push_token_in_use'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Gone:
      description: invite_expired
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooLarge:
      description: file_too_large (request above 12 MB)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: unsupported_media_type
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationFailed:
      description: 'validation_failed (fields per input), unknown_field, weak_password, invalid_password, reason_required, upload_rejected, amount_below_minimum, idempotency_key_reused, <field>_required (confirm_required, confirm_details_required, risk_acknowledged_required, accept_required, accept_partner_required, accept_depiqo_required)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UpgradeRequired:
      description: app_update_required (fields.minimum_version)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: too_many_attempts, support_rate_limited (with Retry-After)
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PartnerUnavailable:
      description: partner_unavailable - no financial or investment partner (always in production without a real partner). Nothing moved.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SettlementResult:
      description: Settlement and deposit after the answer
      content:
        application/json:
          schema:
            type: object
            properties:
              message: {type: string}
              settlement: {$ref: '#/components/schemas/Settlement'}
              deposit: {$ref: '#/components/schemas/DepositDetail'}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: {type: string, description: Stable snake_case code}
            message: {type: string, description: "In the language of Accept-Language (nl, fr, en)"}
            fields:
              type: object
              additionalProperties: true
              description: Per input field a message; for some codes extra data (minimum_version, url)
            detail: {type: string, description: The specific Dutch text when message is a translation}

    Money:
      type: object
      required: [cents, currency]
      properties:
        cents: {type: integer}
        currency: {type: string, const: EUR}

    NullableMoney:
      oneOf:
        - $ref: '#/components/schemas/Money'
        - type: 'null'

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array}
        next_cursor: {type: [string, 'null']}

    Config:
      type: object
      properties:
        api_version: {type: string}
        environment: {type: string, enum: [development, staging, production]}
        banner: {type: [string, 'null'], enum: [STAGING, SANDBOX, null]}
        languages: {type: array, items: {type: string}}
        default_language: {type: string}
        minimum_app_version:
          type: object
          properties:
            ios: {type: string}
            android: {type: string}
