      description: With 2FA on, only a six-digit TOTP code is accepted (never a recovery code). Wrong codes share the counters of the second login step; after 5 in 15 minutes the answer is 429 too_many_attempts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iban]
              properties:
                iban: {type: string}
                code: {type: string, description: TOTP code when two-factor authentication is on}
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: {$ref: '#/components/schemas/InvestAccount'}
                  usable_from: {type: string, format: date-time}
                  usable_now: {type: boolean}
                  cooling_off_days: {type: integer}
                  message: {type: string}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
