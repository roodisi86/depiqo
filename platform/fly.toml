# Staging on Fly.io (sandbox, no real money). Only for staging: one machine, SQLite on a volume.
# Steps (see mobile/docs/RELEASE-VALIDATIE.md, "Staging-backend"):
#   fly launch --no-deploy --copy-config      (pick your own app name; change BASE_URL below to match)
#   fly volumes create depiqo_staging_data --size 1 --region ams
#   fly secrets set SECRET_KEY=$(openssl rand -hex 32) BANK_WEBHOOK_SECRET=$(openssl rand -hex 32)
#   fly deploy
#   fly ssh console -C "setpriv --reuid=depiqo --regid=depiqo --init-groups python3 seed.py --reset"
app = "depiqo-staging"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DEPIQO_ENV = "staging"
  DEPIQO_SANDBOX = "1"
  BASE_URL = "https://depiqo-staging.fly.dev"
  TRUST_PROXY = "1"
  DATABASE_PATH = "/data/depiqo.sqlite3"
  STORAGE_DIR = "/data/storage"
  PUSH_SEND = "0"
  PORT = "8000"

[mounts]
  source = "depiqo_staging_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/config"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
