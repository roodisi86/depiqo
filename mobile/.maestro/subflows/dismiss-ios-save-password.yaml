# iOS offers to save the password in iCloud Keychain after a successful login ("Save Password?").
# That is normal iOS behaviour for real users too; the test answers "Not Now" so the app is visible again.
appId: com.getdepiqo.app.dev
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
