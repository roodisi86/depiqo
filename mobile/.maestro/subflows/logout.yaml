# Profiel -> Uitloggen -> confirm in the system dialog. Ends on the login screen.
appId: com.getdepiqo.app.dev
---
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "profile-logout"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-logout"
# Android: React Native puts the second Alert button (the destructive "log out") on the positive button.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "android:id/button1"
# iOS: the alert's confirm button has its own text ("Ja, uitloggen"), different from the profile button.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "${T_PROFILE_LOGOUT_CONFIRM}"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
