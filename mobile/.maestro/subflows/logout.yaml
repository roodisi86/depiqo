# Profiel -> Uitloggen -> confirm in the system dialog. Ends on the login screen.
appId: com.getdepiqo.app.dev
---
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "profile-logout"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-logout"
# Android: React Native puts the second Alert button (the destructive "log out") on the positive button.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "android:id/button1"
# iOS: the alert button has the same text as the profile button. If both are in the hierarchy, the alert's is the
# second; if only the alert's is, it is the only one. Wait between the two attempts so nothing is tapped twice.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible:
              text: "${T_PROFILE_LOGOUT}"
              index: 1
          commands:
            - tapOn:
                text: "${T_PROFILE_LOGOUT}"
                index: 1
      - extendedWaitUntil:
          visible:
            id: "login-email"
          timeout: 8000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "login-email"
          commands:
            - tapOn:
                text: "${T_PROFILE_LOGOUT}"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
