# Negative: a wrong password shows the translated error and does not log in. The run language is chosen in the app
# first (it stays on the device after logout), so the login screen is in that language.
appId: com.getdepiqo.app.dev
name: "Fout wachtwoord geeft vertaalde foutmelding"
tags: [auth, negative]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: mila@huurder.test
- runFlow: ../subflows/set-language.yaml
- runFlow: ../subflows/logout.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: mila@huurder.test
      PASSWORD: dit-is-niet-het-wachtwoord-2026
- extendedWaitUntil:
    visible:
      text: "(?s).*${T_ERR_INVALID_CREDENTIALS}.*"
    timeout: 20000
- assertNotVisible:
    id: "tab-profile"
- assertVisible:
    id: "login-email"
- takeScreenshot: x-01-wrong-password-${LANG_CODE}
