# Android end-to-end: a release-variant APK of "Depiqo Dev" (JS bundled in the APK, no Metro), installed on an
# Android 14 emulator (API 34, google_apis, x86_64), driven by Maestro against the real Flask backend with a fresh
# demo seed. Three runs: Dutch; Dutch with font scale 1.3 and dark mode; French and English.
#
# The CI APK talks to http://10.0.2.2:5000 (the emulator's address for the runner itself): it is for CI only.
# Set the repository variable STAGING_API_URL (https://...) to also get a staging APK for sideloading on a phone.
name: Android e2e

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "platform/**"
      - ".github/workflows/android-e2e.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"
  JAVA_VERSION: "17"
  MAESTRO_VERSION: "2.6.0"
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  # expo install --fix changes package.json; prebuild must not stop on the dirty git tree in CI.
  EXPO_NO_GIT_STATUS: "1"

jobs:
  build-apk:
    name: Build CI APK (development, 10.0.2.2)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_ENV: development
      EXPO_PUBLIC_API_URL: http://10.0.2.2:5000
      OUT: ${{ github.workspace }}/ci-out/android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: mobile
        run: |
          mkdir -p "$OUT"
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx expo install --fix 2>&1 | tee "$OUT/expo-install-fix.txt"

      - name: Prebuild (android, development, API http://10.0.2.2:5000)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install 2>&1 | tee "$OUT/prebuild.txt"

      - name: Inspect the generated project (signing, cleartext, Gradle task)
        working-directory: mobile/android
        run: |
          cp app/build.gradle "$OUT/build.gradle"
          cp app/src/main/AndroidManifest.xml "$OUT/AndroidManifest.main.xml"
          # Release must be signable for an emulator install. Expo's template signs release with the debug keystore;
          # check the generated file instead of assuming it.
          python3 ../../.github/scripts/check_release_signing.py app/build.gradle
          grep -q 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml \
            || { echo "::error::usesCleartextTraffic is not set for the development build (app.config.ts plugin)"; exit 1; }
          ./gradlew --no-daemon -q :app:tasks --all > "$OUT/gradle-tasks.txt"
          grep -E '^assembleRelease\b' "$OUT/gradle-tasks.txt" \
            || { echo "::error::No assembleRelease task; available assemble tasks:"; grep -E '^assemble' "$OUT/gradle-tasks.txt"; exit 1; }

      - name: Build release APK (JS bundled, debug keystore)
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a 2>&1 | tee "$OUT/gradle-assembleRelease.txt"

      - name: Verify the APK
        run: |
          apks=(mobile/android/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -eq 1 ] && [ -f "${apks[0]}" ] || { echo "::error::expected one release APK, found: ${apks[*]}"; exit 1; }
          apk="${apks[0]}"
          cp "$apk" "$OUT/depiqo-dev-ci-10.0.2.2.apk"
          unzip -l "$apk" > "$OUT/apk-contents.txt"
          grep -q 'assets/index.android.bundle' "$OUT/apk-contents.txt" || { echo "::error::no JS bundle in the APK (it would need Metro)"; exit 1; }
          unzip -p "$apk" assets/app.config > "$OUT/apk-app.config.json"
          python3 - "$OUT/apk-app.config.json" <<'PY'
          import json, sys
          extra = json.load(open(sys.argv[1]))["extra"]
          assert extra["appEnv"] == "development", extra
          assert extra["apiUrl"] == "http://10.0.2.2:5000", f"embedded apiUrl is {extra['apiUrl']!r}"
          assert extra["investEnabled"] is True, "Invest must be in the development build (flow h)"
          print("CI APK: development, API http://10.0.2.2:5000, Invest in the build")
          PY
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | tee "$OUT/apksigner.txt"
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$OUT/AndroidManifest.merged.txt"
          grep -q 'package="com.getdepiqo.app.dev"' "$OUT/AndroidManifest.merged.txt" || { echo "::error::unexpected package"; exit 1; }
          grep -Eq 'usesCleartextTraffic.*=(true|-1|0xffffffff)' "$OUT/AndroidManifest.merged.txt" || { echo "::error::cleartext not allowed in the CI APK"; exit 1; }
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-ci
          path: ci-out/android-build/depiqo-dev-ci-10.0.2.2.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: |
            ci-out/android-build
            !ci-out/android-build/*.apk
          if-no-files-found: warn
          retention-days: 14

  build-staging-apk:
    name: Build staging APK (only when vars.STAGING_API_URL is set)
    if: vars.STAGING_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_ENV: staging
      EXPO_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      OUT: ${{ github.workspace }}/ci-out/android-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Install and prebuild (android, staging)
        working-directory: mobile
        run: |
          mkdir -p "$OUT"
          case "$EXPO_PUBLIC_API_URL" in https://*) ;; *) echo "::error::STAGING_API_URL must start with https://"; exit 1 ;; esac
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx expo install --fix
          npx expo prebuild --platform android --no-install 2>&1 | tee "$OUT/prebuild.txt"
          cp android/app/build.gradle "$OUT/build.gradle"
          python3 ../.github/scripts/check_release_signing.py android/app/build.gradle
          if grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::the staging app must not allow cleartext"; exit 1
          fi

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee "$OUT/gradle-assembleRelease.txt"

      - name: Verify the APK
        run: |
          apks=(mobile/android/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -eq 1 ] && [ -f "${apks[0]}" ] || { echo "::error::expected one release APK"; exit 1; }
          apk="${apks[0]}"
          cp "$apk" "$OUT/depiqo-staging.apk"
          unzip -p "$apk" assets/app.config > "$OUT/apk-app.config.json"
          python3 - "$OUT/apk-app.config.json" <<'PY'
          import json, os, sys
          extra = json.load(open(sys.argv[1]))["extra"]
          want = os.environ["EXPO_PUBLIC_API_URL"].rstrip("/")
          assert extra["appEnv"] == "staging", extra
          assert extra["apiUrl"] == want, f"embedded apiUrl {extra['apiUrl']!r} is not STAGING_API_URL"
          print("staging APK points at the STAGING_API_URL variable")
          PY
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$OUT/AndroidManifest.merged.txt"
          grep -q 'package="com.getdepiqo.app.staging"' "$OUT/AndroidManifest.merged.txt" || { echo "::error::unexpected package"; exit 1; }
          if grep -Eq 'usesCleartextTraffic.*=(true|-1|0xffffffff)' "$OUT/AndroidManifest.merged.txt"; then
            echo "::error::cleartext allowed in the staging APK"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-staging
          path: ci-out/android-staging/depiqo-staging.apk
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Emulator + Maestro (${{ matrix.variant }})
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [nl, large-dark, fr-en]
    env:
      E2E_WORK: ${{ github.workspace }}/../e2e-work
      RESULTS: ${{ github.workspace }}/ci-out/android-e2e/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: apk-ci
          path: ${{ runner.temp }}/apk

      - name: Start the backend (0.0.0.0:5000, fresh seed, sandbox)
        run: |
          pip install -r platform/requirements.txt
          mkdir -p "$RESULTS"
          .github/scripts/start_backend.sh 0.0.0.0:5000 "$E2E_WORK"

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run the suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_e2e_run.sh ${{ matrix.variant }} ${{ runner.temp }}/apk/depiqo-dev-ci-10.0.2.2.apk ${{ env.RESULTS }}

      - name: Maestro report
        if: always()
        run: python3 .github/scripts/maestro_report.py "$RESULTS" "Android e2e (${{ matrix.variant }})"

      - name: Collect backend logs
        if: always()
        run: |
          mkdir -p "$RESULTS/backend"
          if [ -d "$E2E_WORK/logs" ]; then cp -r "$E2E_WORK/logs/." "$RESULTS/backend/"; fi
          if [ -f "$E2E_WORK/backend.pid" ]; then kill "$(cat "$E2E_WORK/backend.pid")" 2>/dev/null || echo "backend already stopped"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-${{ matrix.variant }}
          path: ci-out/android-e2e/${{ matrix.variant }}
          if-no-files-found: warn
          retention-days: 30
