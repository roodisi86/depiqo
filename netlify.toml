# Netlify (website getdepiqo.com): connect the GitHub repo roodisi86/depiqo; these settings are read from here.
# Only changes under website/ trigger a new deploy.
[build]
  base = "website"
  command = "python3 src/build.py"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  PYTHON_VERSION = "3.13"
